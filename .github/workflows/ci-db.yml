name: CI - DB

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "packages/db/**"
      - "package-lock.json"
      - "turbo.json"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint -- --filter=@devlib/db

      - name: Build
        run: npm run build -- --filter=@devlib/db

      - name: Testes
        run: npm run test -- --filter=@devlib/db
